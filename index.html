<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Landy is a no-code landing page builder. Design visually, publish with one click, or export clean HTML and React." />
  <meta name="theme-color" content="#0e0e12" />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <title>Landy — No-Code Landing Page Builder</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='800' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='128' font-family='Arial,sans-serif' font-size='100' font-weight='800' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />

  <meta property="og:title" content="Landy — No-Code Landing Page Builder" />
  <meta property="og:description" content="Design landing pages visually, publish with one click, or export clean HTML and React." />
  <meta property="og:type" content="website" />

  <style>
    html, body { margin: 0; padding: 0; background: #0e0e12; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    #root { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* ── 3D splash screen (pure CSS, no dependencies) ───────── */
    #splash {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
      background:
        radial-gradient(900px 520px at 50% 30%, rgba(124, 58, 237, .32), transparent 70%),
        radial-gradient(700px 500px at 85% 100%, rgba(24, 160, 251, .16), transparent 70%),
        #0e0e12;
      transition: opacity .55s ease, visibility .55s ease;
    }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash::before {
      content: ''; position: absolute; left: -50%; right: -50%; bottom: -10%; height: 55%;
      background-image: linear-gradient(rgba(139, 92, 246, .22) 1px, transparent 1px), linear-gradient(90deg, rgba(139, 92, 246, .22) 1px, transparent 1px);
      background-size: 48px 48px; transform: perspective(500px) rotateX(64deg); transform-origin: 50% 100%;
      -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); mask-image: linear-gradient(to top, #000 0%, transparent 85%);
      animation: gridMove 3s linear infinite;
    }
    .stage { position: relative; width: 280px; height: 260px; perspective: 900px; perspective-origin: 50% 35%; }
    .bob { position: absolute; inset: 0; transform-style: preserve-3d; animation: bob 3.2s ease-in-out infinite; }
    .cube {
      position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px;
      transform-style: preserve-3d; animation: spin 8s linear infinite;
    }
    .face {
      position: absolute; inset: 0; display: grid; place-items: center; border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, .28);
      box-shadow: inset 0 0 30px rgba(255, 255, 255, .16), 0 0 24px rgba(124, 58, 237, .35);
      font: 900 58px/1 'Inter', system-ui, sans-serif; color: rgba(255, 255, 255, .96);
      text-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    }
    .f1 { background: linear-gradient(135deg, #9b6dff, #4f46e5); transform: translateZ(56px); }
    .f2 { background: linear-gradient(135deg, #7c3aed, #2563eb); transform: rotateY(180deg) translateZ(56px); }
    .f3 { background: linear-gradient(135deg, #6d4cf0, #3b82f6); transform: rotateY(90deg) translateZ(56px); }
    .f4 { background: linear-gradient(135deg, #5b3fd8, #1d4ed8); transform: rotateY(-90deg) translateZ(56px); }
    .f5 { background: linear-gradient(135deg, #b794ff, #7c3aed); transform: rotateX(90deg) translateZ(56px); }
    .f6 { background: linear-gradient(135deg, #3730a3, #1e3a8a); transform: rotateX(-90deg) translateZ(56px); }
    .f5, .f6 { font-size: 0; }
    .ring {
      position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 2px solid rgba(139, 92, 246, .5);
      transform: translate(-50%, -50%) rotateX(74deg); box-shadow: 0 0 18px rgba(139, 92, 246, .35);
    }
    .ring::after { content: ''; position: absolute; top: -6px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #c4b5fd; box-shadow: 0 0 14px 4px rgba(196, 181, 253, .8); }
    .r1 { width: 220px; height: 220px; animation: orbit 5s linear infinite; }
    .r2 { width: 168px; height: 168px; border-color: rgba(24, 160, 251, .45); animation: orbit 3.6s linear infinite reverse; }
    .r2::after { background: #7dd3fc; box-shadow: 0 0 14px 4px rgba(125, 211, 252, .8); }
    .chip {
      position: absolute; width: 58px; height: 40px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .22);
      background: rgba(255, 255, 255, .08); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .35); animation: float 4s ease-in-out infinite;
    }
    .chip::before { content: ''; position: absolute; left: 8px; right: 22px; top: 9px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .45); }
    .chip::after { content: ''; position: absolute; left: 8px; right: 8px; top: 19px; height: 12px; border-radius: 3px; background: rgba(255, 255, 255, .16); }
    .c1 { left: 6px; top: 34px; transform: translateZ(70px) rotateY(24deg); }
    .c2 { right: 2px; top: 70px; transform: translateZ(40px) rotateY(-26deg); animation-delay: -1.3s; }
    .c3 { left: 28px; bottom: 34px; transform: translateZ(90px) rotateY(18deg); animation-delay: -2.4s; }
    .floor { position: absolute; left: 50%; bottom: 0; width: 170px; height: 30px; margin-left: -85px; background: radial-gradient(ellipse at center, rgba(139, 92, 246, .6), transparent 70%); filter: blur(7px); animation: shadow 3.2s ease-in-out infinite; }
    .brand { position: relative; text-align: center; animation: rise .8s .1s ease both; }
    .brand h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.04em; color: #f4f4f8; }
    .brand p { margin: 6px 0 0; font-size: 12.5px; font-weight: 500; color: #8c8c9a; letter-spacing: .02em; }
    .bar { position: relative; width: 170px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5); }
    .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #8b5cf6, #2563eb); box-shadow: 0 0 12px rgba(124, 58, 237, .8); animation: load 2s cubic-bezier(.4, 0, .2, 1) forwards; transition: width .25s ease; }
    @keyframes spin { from { transform: rotateX(-24deg) rotateY(0deg); } to { transform: rotateX(-24deg) rotateY(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes orbit { to { transform: translate(-50%, -50%) rotateX(74deg) rotateZ(360deg); } }
    @keyframes float { 0%, 100% { margin-top: 0; } 50% { margin-top: -10px; } }
    @keyframes shadow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.82); opacity: .55; } }
    @keyframes gridMove { to { background-position: 0 48px; } }
    @keyframes load { to { width: 92%; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .cube, .bob, .ring, .chip, .floor, #splash::before { animation: none !important; }
      .cube { transform: rotateX(-24deg) rotateY(32deg); }
    }
    @media (max-width: 480px) { .stage { transform: scale(.82); } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Loading Landy">
    <div class="stage" aria-hidden="true">
      <div class="floor"></div>
      <div class="bob">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="cube">
          <div class="face f1">L</div><div class="face f2">L</div><div class="face f3">L</div>
          <div class="face f4">L</div><div class="face f5"></div><div class="face f6"></div>
        </div>
        <div class="chip c1"></div><div class="chip c2"></div><div class="chip c3"></div>
      </div>
    </div>
    <div class="brand"><h1>Landy</h1><p>No-code landing page builder</p></div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>

  <div id="root"></div>
  <noscript><p style="color:#e5e5e5;font-family:system-ui;padding:2rem;text-align:center">Landy needs JavaScript to run. Please enable it and reload the page.</p></noscript>

  <script>
    // The app calls window.__landyReady() once it has mounted. The splash is shown for at least
    // 1.8 s so the animation is visible, and a fail-safe removes it after 9 s so it can never hang.
    (function () {
      var start = Date.now(), MIN = 1800, done = false;
      window.__landyReady = function () {
        if (done) return;
        done = true;
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (!s) return;
          var bar = s.querySelector('.bar i');
          if (bar) { bar.style.animation = 'none'; bar.style.width = '100%'; }
          setTimeout(function () {
            s.classList.add('out');
            setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 650);
          }, 260);
        }, Math.max(0, MIN - (Date.now() - start)));
      };
      setTimeout(window.__landyReady, 9000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
